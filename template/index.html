{% extends "base.html" %}{% block content %}
<form class="search" method="get">
<input name="q" value="{{ q }}" placeholder="Search items, places...">
<select name="kind"><option value="">All</option>
<option value="lost" {{ 'selected' if kind=='lost' }}>Lost</option>
<option value="found" {{ 'selected' if kind=='found' }}>Found</option></select>
<button>Search</button></form>
<div class="grid">
{% for i in items %}
<a class="card" href="{{ url_for('item', item_id=i.id) }}">
{% if i.image %}<img src="{{ url_for('uploads', name=i.image) }}" alt="">{% endif %}
<span class="tag {{ i.kind }}">{{ i.kind }}</span>
<h3>{{ i.title }}</h3><p>{{ i.category }} · {{ i.location }} · {{ i.date }}</p></a>
{% else %}<p>No items yet.</p>{% endfor %}
</div>{% endblock %}
